version: '3.8'

services:
  pharmago-chat:
    build:
      context: .
      dockerfile: PharmaGo.Chat.Grpc/Dockerfile
    container_name: pharmago-chat
    ports:
      - "5100:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_HOST=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DATABASE=1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=pharmago_chat
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pharmago-chat-network
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: pharmago-chat-postgres
    environment:
      - POSTGRES_DB=pharmago_chat
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharmago-chat-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pharmago-chat-redis
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharmago-chat-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

networks:
  pharmago-chat-network:
    driver: bridge
