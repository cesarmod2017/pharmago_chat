syntax = "proto3";

option csharp_namespace = "PharmaGo.Chat.Grpc.Protos";

package chat;

import "google/protobuf/timestamp.proto";

// ============================================================================
// RAG Service - Manage RAG knowledge base with vector embeddings
// Uses DocumentEntity for storage with OpenAI embeddings
// Supports filtering by 'type' field for multi-client/agent scenarios
// ============================================================================
service RAGService {
  // Add document/text for training (embedding generation)
  rpc AddDocument (RagAddDocumentRequest) returns (RagAddDocumentResponse);

  // Add multiple documents in batch
  rpc AddDocumentsBatch (RagAddDocumentsBatchRequest) returns (RagAddDocumentsBatchResponse);

  // Upload multiple files in batch with streaming progress notifications
  // Client sends files, server streams back progress for each file
  rpc UploadFilesBatch (RagUploadFilesBatchRequest) returns (stream RagUploadFileProgress);

  // Delete a document from RAG base
  rpc DeleteDocument (RagDeleteDocumentRequest) returns (RagDeleteDocumentResponse);

  // Delete multiple documents
  rpc DeleteDocumentsBatch (RagDeleteDocumentsBatchRequest) returns (RagDeleteDocumentsBatchResponse);

  // List all documents in RAG base
  rpc ListDocuments (RagListDocumentsRequest) returns (RagListDocumentsResponse);

  // Get document details
  rpc GetDocument (RagGetDocumentRequest) returns (RagDocumentInfo);

  // Search documents by query (semantic search)
  rpc SearchDocuments (RagSearchDocumentsRequest) returns (RagSearchDocumentsResponse);

  // ============================================================================
  // DocumentsTable operations (Supabase-style direct embedding storage)
  // ============================================================================

  // Add a document with embedding directly to documents table
  rpc AddEmbeddingDocument (RagAddEmbeddingDocumentRequest) returns (RagAddEmbeddingDocumentResponse);

  // Delete a document from documents table
  rpc DeleteEmbeddingDocument (RagDeleteEmbeddingDocumentRequest) returns (RagDeleteEmbeddingDocumentResponse);

  // Search documents by embedding similarity (returns top N most similar)
  rpc SearchEmbeddingDocuments (RagSearchEmbeddingDocumentsRequest) returns (RagSearchEmbeddingDocumentsResponse);
}

// ============================================================================
// RAG Messages
// ============================================================================

message RagAddDocumentRequest {
  string title = 1;
  string content = 2;
  string document_type = 3; // text, markdown, pdf_text, html
  string type = 4; // Client/agent filter: farmago, linx, aotech, etc.
  map<string, string> metadata = 5;
  repeated string tags = 6;
}

message RagAddDocumentResponse {
  string document_id = 1;
  int32 chunks_created = 2;
  google.protobuf.Timestamp created_at = 3;
}

message RagAddDocumentsBatchRequest {
  repeated RagAddDocumentRequest documents = 1;
}

message RagAddDocumentsBatchResponse {
  repeated RagAddDocumentResponse results = 1;
  int32 success_count = 2;
  int32 failure_count = 3;
  repeated string errors = 4;
}

message RagDeleteDocumentRequest {
  string document_id = 1;
}

message RagDeleteDocumentResponse {
  bool success = 1;
  int32 chunks_deleted = 2;
}

message RagDeleteDocumentsBatchRequest {
  repeated string document_ids = 1;
}

message RagDeleteDocumentsBatchResponse {
  int32 success_count = 1;
  int32 failure_count = 2;
  repeated string errors = 3;
}

message RagListDocumentsRequest {
  int32 limit = 1;
  int32 offset = 2;
  string document_type_filter = 3; // Filter by document type: text, markdown, pdf_text, html
  string type_filter = 4; // Filter by client/agent type: farmago, linx, aotech, etc.
  repeated string tag_filter = 5;
}

message RagListDocumentsResponse {
  repeated RagDocumentInfo documents = 1;
  int32 total_count = 2;
}

message RagGetDocumentRequest {
  string document_id = 1;
}

message RagDocumentInfo {
  string document_id = 1;
  string title = 2;
  string document_type = 3;
  string type = 4; // Client/agent type: farmago, linx, aotech, etc.
  int32 chunk_count = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  map<string, string> metadata = 8;
  repeated string tags = 9;
  int32 content_length = 10;
}

message RagSearchDocumentsRequest {
  string query = 1;
  int32 limit = 2; // Max results
  float similarity_threshold = 3; // 0.0 - 1.0
  string type_filter = 4; // Filter by client/agent type: farmago, linx, aotech, etc.
  repeated string tag_filter = 5;
}

message RagSearchDocumentsResponse {
  repeated RagSearchResult results = 1;
}

message RagSearchResult {
  string document_id = 1;
  string chunk_id = 2;
  string title = 3;
  string content = 4;
  string type = 5; // Client/agent type: farmago, linx, aotech, etc.
  float similarity_score = 6;
  map<string, string> metadata = 7;
  repeated string tags = 8;
}

// ============================================================================
// DocumentsTable Messages (Supabase-style direct embedding storage)
// ============================================================================

message RagAddEmbeddingDocumentRequest {
  string content = 1;
  map<string, string> metadata = 2;
}

message RagAddEmbeddingDocumentResponse {
  int64 document_id = 1;
}

message RagDeleteEmbeddingDocumentRequest {
  int64 document_id = 1;
}

message RagDeleteEmbeddingDocumentResponse {
  bool success = 1;
}

message RagSearchEmbeddingDocumentsRequest {
  string query = 1;
  int32 limit = 2; // Max results (default 5)
  map<string, string> filter = 3; // Optional metadata filter
}

message RagSearchEmbeddingDocumentsResponse {
  repeated RagEmbeddingSearchResult results = 1;
}

message RagEmbeddingSearchResult {
  int64 id = 1;
  string content = 2;
  map<string, string> metadata = 3;
  float similarity_score = 4;
}

// ============================================================================
// Batch File Upload Messages (Server Streaming)
// ============================================================================

// File to be uploaded in batch
message RagUploadFile {
  string file_name = 1;        // Original file name (e.g., "document.md")
  string content = 2;          // File content as text
  string document_type = 3;    // text, markdown (auto-detected from extension if empty)
  string type = 4;             // Client/agent filter: farmago, linx, aotech, etc.
  map<string, string> metadata = 5;
  repeated string tags = 6;
}

// Request to upload multiple files
message RagUploadFilesBatchRequest {
  repeated RagUploadFile files = 1;
}

// Progress status for file upload
enum RagUploadStatus {
  UPLOAD_STATUS_UNKNOWN = 0;
  UPLOAD_STATUS_RECEIVED = 1;      // File received by server
  UPLOAD_STATUS_PROCESSING = 2;    // Processing/embedding generation started
  UPLOAD_STATUS_COMPLETED = 3;     // Successfully processed and saved
  UPLOAD_STATUS_FAILED = 4;        // Processing failed
}

// Progress notification for each file (streamed back to client)
message RagUploadFileProgress {
  string file_name = 1;            // Which file this progress is for
  int32 file_index = 2;            // Index in the batch (0-based)
  int32 total_files = 3;           // Total files in batch
  RagUploadStatus status = 4;      // Current status
  string message = 5;              // Human-readable status message
  int64 document_id = 6;           // Document ID if completed successfully
  string error = 7;                // Error message if failed
  google.protobuf.Timestamp timestamp = 8;
}
